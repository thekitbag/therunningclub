name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  verify:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rmpac
          POSTGRES_PASSWORD: rmpac
          POSTGRES_DB: rmpac_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rmpac:rmpac@localhost:5432/rmpac_test
      APP_ORIGIN: http://127.0.0.1:3100
      SESSION_SECRET: ci-only-session-secret-well-over-thirty-two-characters
      JUSTGIVING_URL: https://www.justgiving.com/page/ci-fixture
      # The browser suite runs against a gated site, because that is what
      # production is. Without this the server refuses to start — which is the
      # fail-fast check working, not a bug.
      SITE_PASSCODE: ci-club-passcode
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` fails if the lockfile and package.json disagree, which is the
      # check that keeps the committed lockfile honest.
      - name: Install from the lockfile
        run: npm ci

      - name: Generate the Prisma client
        run: npm run prisma:generate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Verify migrations are in sync with the schema
        run: npx prisma migrate status

      - name: Integration tests
        run: npx vitest run --project integration

      - name: Production build
        run: npm run build

      - name: Install the browser used by the smoke tests
        run: npx playwright install --with-deps chromium

      - name: Browser journeys and accessibility scans
        run: npx playwright test
        env:
          CI: 'true'

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Production dependencies only: a dev-only advisory should not block a
      # release, but it is still visible in the log.
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Report development advisories without failing
        run: npm audit || true
